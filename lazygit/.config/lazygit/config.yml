# lazygit reads this because .zshenv exports XDG_CONFIG_HOME; without it lazygit
# falls back to ~/Library/Application Support/lazygit/config.yml on macOS.

gui:
  # Catppuccin Mocha, blue accent — verbatim from catppuccin/lazygit
  # themes/mocha/blue.yml, so it stays diffable against upstream.
  theme:
    activeBorderColor:
      - '#89b4fa'
      - bold
    inactiveBorderColor:
      - '#a6adc8'
    searchingActiveBorderColor:
      - '#f9e2af'
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    inactiveViewSelectedLineBgColor:
      - '#6c7086'
    cherryPickedCommitFgColor:
      - '#89b4fa'
    cherryPickedCommitBgColor:
      - '#45475a'
    markedBaseCommitFgColor:
      - '#89b4fa'
    markedBaseCommitBgColor:
      - '#f9e2af'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'
  authorColors:
    '*': '#b4befe'

git:
  # Same pager the git package sets as core.pager; lazygit does not inherit it.
  diffRenderers:
    - command: delta --dark --paging=never
