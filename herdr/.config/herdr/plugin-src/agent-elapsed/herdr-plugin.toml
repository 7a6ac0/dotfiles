# Supplies the `$elapsed` token that ui.sidebar.agents renders.
#
# A plugin rather than a script hanging off some other feature: startup
# commands are the only long-lived process herdr supervises, so the token's
# lifetime matches the server's instead of depending on an unrelated config
# entry staying non-empty.
id = "agent-elapsed"
name = "agent-elapsed"
version = "0.1.0"
min_herdr_version = "0.8.0"

# Declared rather than omitted so linking on another OS reports an unsupported
# platform instead of starting a loop that quietly does nothing. The script is
# POSIX sh and would likely run on linux, but that is untested here.
platforms = ["macos"]

[[startup]]
command = ["./agent-elapsed.sh"]
